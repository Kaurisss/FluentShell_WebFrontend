name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the local Node/npm that generated package-lock.json —
          # npm 10 (bundled with Node 22) cannot consume npm 11 lock files.
          node-version: 24
          cache: npm

      - uses: actions/configure-pages@v5

      # Project repositories serve from /<repo>; <user>.github.io from the root.
      - name: Compute base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io${{ steps.base.outputs.path }}

      # next.config.ts skips redirects() in export mode; emulate "/" -> "/en"
      # with a meta refresh. ".nojekyll" keeps Pages from dropping _next/.
      - name: Add root redirect and .nojekyll
        run: |
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<title>Redirecting…</title>' \
            '<meta http-equiv="refresh" content="0; url=./en/">' \
            '<link rel="canonical" href="./en/">' \
            '<a href="./en/">Redirecting…</a>' \
            > out/index.html
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
